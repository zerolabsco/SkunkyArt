<!DOCTYPE html>
<html lang="{{.Lang}}">
    <head>
        <title>SkunkyArt</title>
        <link rel="stylesheet" href="{{.BasePath}}stylesheet"/>
        <link rel="icon" type="image/x-icon" href="{{.BasePath}}favicon.ico">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=0.4"/>

        <style>
            main {
                display: flex;
                max-width: fit-content;
                position: absolute;
                top: 50%;
                right: 50%;
                transform: translate(50%, -50%);
            }
            div {
                transform: translate(0, 50%);
                margin-left: 4%;
                flex-basis: 100%;
                height: 30%;
                display: block;
                max-width: fit-content;
            }     
            div h1, form {
                margin: 0;
            }
            div form {
                font-size: 100%;
                max-width: 100%
            }
            div form input {
                width: 100%
            }
            img {
                width: 30%;
                height: 30%;
            }

            @media (orientation: portrait) {
                main {
                    display: block;
                    width: 200%;
                }
                img {
                    width: 100%;
                    height: 100%;
                }
                form {
                    width: 200%;
                }
                div {
                    margin: -25%;
                    margin-top: auto;
                    width: 200%;
                }
                div h1 {
                    text-align: center;
                }
            }
            @media (max-width: 1155px) and (orientation: landscape) {
                img {
                    width: 50%;
                }
                div {
                    transform: none;
                }
            }
        </style>
    </head>
    <main>
        <img src="{{.BasePath}}favicon.ico" title="{{T "index.logo"}}" alt="SkunkyArt logo" draggable="false">
        <div>
            <h1><a href="{{.BasePath}}dd">{{T "nav.daily"}}</a> | <a href="{{.BasePath}}about">{{T "nav.about"}}</a></h1>
            <form method="get" action="{{.BasePath}}search">
                <input type="text" name="q" aria-label="Search query" placeholder="{{T "search.placeholder"}}" autocomplete="off" autocapitalize="none" spellcheck="false">
                <select name="type" aria-label="Search type">
                    <option value="all">{{T "search.all"}}</option>
                    <option value="tag">{{T "search.tag"}}</option>
                    <option value="r">{{T "search.groups"}}</option>
                </select>
                <button type="submit">{{T "search.submit"}}</button>
            </form>
            <h1 style="margin-top: 5%; font-size: 200%; text-align: center;">
                <a href="https://github.com/krazywarez/skunky-art" target="_blank" title="{{T "index.source"}}">SkunkyArt</a>
            </h1>
        </div>
    </main>
</html>
