<!DOCTYPE html>
<html lang="{{.Lang}}">
    {{template "head" . }}
    <main>
        {{template "header" . }}
        
        {{if ne .Templates.Search.List ""}}
        {{if ne .Templates.Search.Content.Total 0}}
        <h1>{{T "search.results"}} '{{.QueryRaw}}': {{.Templates.Search.Content.Total}}</h1>
        {{end}}
        {{.Templates.Search.List}}
        {{else}}
        <p>{{T "search.none"}}</p>
        {{end}}
    </main>
</html>
